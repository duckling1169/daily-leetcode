name: Daily LeetCode

on:
  schedule:
    - cron: "7 6 * * *" # 06:07 UTC. Off the hour: GitHub drops scheduled runs at busy times.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv run daily_leetcode.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          LEETCODE_TAGS: >-
            array,binary-search,binary-search-tree,binary-tree,bit-manipulation,
            breadth-first-search,depth-first-search,divide-and-conquer,dynamic-programming,
            greedy,hash-table,heap-priority-queue,linked-list,prefix-sum,recursion,
            sliding-window,sorting,stack,string,tree,two-pointers
